name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $scripts = @(
            Get-Item -Path install-searxng-windows.ps1
            Get-ChildItem -Path scripts -Filter *.ps1
            Get-ChildItem -Path tests -Filter *.ps1

          )
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              Write-Error "PowerShell syntax errors in $($script.FullName): $($errors | Out-String)"
            }
          }

      - name: Exercise CMD launchers and subprocess quoting
        shell: powershell
        run: |
          .\tests\windows-launchers.ps1

      - name: Verify stop-script no-op does not target unrelated processes
        shell: powershell
        run: |
          $TestRoot = Join-Path $env:RUNNER_TEMP "not-a-searxng-install"
          .\scripts\stop.ps1 -Root $TestRoot

      - name: Check Python syntax
        shell: pwsh
        run: |
          $pythonFiles = @(
            "skill/scripts/search.py"
            "skill/scripts/searxng.py"
            "patches/api_pool.py"
            "scripts/extract-source.py"
          )
          $pythonFiles += Get-ChildItem -Path api_pool -Filter *.py -Recurse | ForEach-Object { $_.FullName }
          python -m py_compile @pythonFiles

      - name: Build release candidate (dry run)
        shell: pwsh
        run: |
          .\scripts\build-release.ps1 -Tag "v0.0.0-ci" -OutputDir "$env:RUNNER_TEMP\release-smoke"

      - name: Run API Pool tests
        shell: pwsh
        run: |
          python -m pip install -r api_pool/requirements.txt
          python -m unittest discover -s api_pool/tests -v

  windows-install-smoke:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install and launch actual SearXNG in Windows
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $Root = Join-Path $env:RUNNER_TEMP "searxng install with spaces"
          try {
            .\scripts\install.ps1 -Root $Root -RuntimePython (Get-Command python).Source
            if ($LASTEXITCODE -ne 0) { throw "Initial install failed: $LASTEXITCODE" }
            $Settings = Join-Path $Root "config\settings.yml"
            $SavedSettings = [IO.File]::ReadAllText($Settings)

            & (Join-Path $Root "start-searxng.cmd")
            if ($LASTEXITCODE -ne 0) { throw "Start launcher failed: $LASTEXITCODE" }
            & (Join-Path $Root "check-searxng.cmd")
            if ($LASTEXITCODE -ne 0) { throw "Check launcher failed: $LASTEXITCODE" }
            $Response = Invoke-WebRequest -Uri "http://127.0.0.1:8888/" -UseBasicParsing -TimeoutSec 15
            if ($Response.StatusCode -ne 200) { throw "Unexpected HTTP $($Response.StatusCode)" }

            & (Join-Path $Root "stop-searxng.cmd")
            if ($LASTEXITCODE -ne 0) { throw "Stop launcher failed: $LASTEXITCODE" }

            .\scripts\install.ps1 -Root $Root -RuntimePython (Get-Command python).Source
            if ($LASTEXITCODE -ne 0) { throw "Reinstall failed: $LASTEXITCODE" }
            if ([IO.File]::ReadAllText($Settings) -cne $SavedSettings) {
              throw "Reinstall modified user settings."
            }
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $Root "scripts\update.ps1") -Root $Root
            if ($LASTEXITCODE -ne 0) { throw "Upstream update failed: $LASTEXITCODE" }
            if ([IO.File]::ReadAllText($Settings) -cne $SavedSettings) {
              throw "Upstream update modified user settings."
            }
            & (Join-Path $Root "start-searxng.cmd")
            if ($LASTEXITCODE -ne 0) { throw "Post-update startup failed: $LASTEXITCODE" }
            & (Join-Path $Root "check-searxng.cmd")
            if ($LASTEXITCODE -ne 0) { throw "Post-update health check failed: $LASTEXITCODE" }
            & (Join-Path $Root "stop-searxng.cmd")
            if ($LASTEXITCODE -ne 0) { throw "Post-update stop failed: $LASTEXITCODE" }
            Write-Host "PASS full Windows install, launch, health, stop, reinstall, update, config preservation and post-update restart."
          } finally {
            if (Test-Path -LiteralPath (Join-Path $Root "scripts\stop.ps1")) {
              & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $Root "scripts\stop.ps1") -Root $Root
            }
          }
